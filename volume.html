<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Audio 태그 + GainNode 볼륨 조절</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin-top: 100px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
        }
        .control-group {
            text-align: left;
            margin-top: 15px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }
        .value-display {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Audio 태그와 GainNode 연동</h2>
        <p>오디오를 재생하고 변수 기반 슬라이더로 볼륨을 조절해보세요.</p>
        
        <!-- 실제 오디오 태그 -->
        <audio id="myAudio" controls crossorigin="anonymous" src="Mikrokosmos.mp3"></audio>
        
        <div class="control-group">
            <label for="volumeRange">볼륨 변수값 (Volume): <span id="volDisplay" class="value-display">0.5</span></label>
            <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <script>
        const audioElement = document.getElementById('myAudio');
        const volumeRange = document.getElementById('volumeRange');
        const volDisplay = document.getElementById('volDisplay');

        // 1. 볼륨을 제어할 기준 변수 선언
        let currentVolume = 0.5;

        let audioCtx = null;
        let gainNode = null;
        let isInitialized = false;

        // 브라우저 정책상 오디오가 재생되거나 사용자가 상호작용할 때 AudioContext 연결 필요
        audioElement.addEventListener('play', () => {
            if (!isInitialized) {
                // AudioContext 생성
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // 2. <audio> 태그를 웹 오디오 소스로 변환
                const sourceNode = audioCtx.createMediaElementSource(audioElement);

                // 3. GainNode(볼륨 조절 노드) 생성
                gainNode = audioCtx.createGain();

                // 초기 변수값을 GainNode에 반영
                gainNode.gain.value = currentVolume;

                // 4. 노드 연결: audio 소스 -> GainNode -> 스피커(Destination)
                sourceNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                isInitialized = true;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        // 5. 변수값을 변경하고 GainNode에 적용하는 함수
        function updateVolume(newVal) {
            currentVolume = newVal; // 변수값 업데이트
            volDisplay.textContent = currentVolume;

            // GainNode가 생성되어 있다면 실시간으로 반영
            if (gainNode && audioCtx) {
                gainNode.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
            }
        }

        // 슬라이더 조작 시 변수 변경 함수 호출
        volumeRange.addEventListener('input', (event) => {
            const value = parseFloat(event.target.value);
            updateVolume(value);
        });

        // 필요시 코드 내에서 언제든지 변수만 바꿔서 볼륨 조절 가능 (예: 외부 함수 호출 등)
        // 예: updateVolume(0.2); 로 강제 조절 가능
    </script>

</body>
</html>
